<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syna's Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap">
<style>
  :root {
    --page: #f1eeff; --ink: #221c48; --soft: #6a6396; --plank: #221c48; --track: #e2ddfb;
    --tomato: #ff5a4e; --sun: #ffc23c; --grass: #25b872; --sky: #3d86ff;
    --gum: #ff79c4; --grape: #8a5cf6; --tang: #ff8a3d; --teal: #14b3a6;
    --heat1: #d9ccff; --heat2: #b69bff; --heat3: #8a5cf6; --heat4: #5b2fd1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --page: #17132e; --ink: #f1eeff; --soft: #a79fd6; --plank: #f1eeff; --track: #2a2450;
            --heat1: #3b2f74; --heat2: #5b43b3; --heat3: #8a5cf6; --heat4: #c3a8ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
         font: 400 17px/1.55 "Bricolage Grotesque", system-ui, sans-serif; font-variation-settings: "wdth" 100; }
  main { max-width: 1000px; margin: 0 auto; padding: 32px 20px 72px; }
  a { color: inherit; }
  a:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; border-radius: 4px; }
  h1, h2 { margin: 0; font-weight: 800; letter-spacing: -0.02em; }
  h1 { font-size: clamp(44px, 9vw, 88px); line-height: 0.92; font-variation-settings: "wdth" 75, "opsz" 96; }
  h2 { font-size: 26px; margin: 56px 0 6px; font-variation-settings: "wdth" 85; }
  .lede { font-size: 20px; max-width: 34em; margin: 14px 0 0; }
  .lede b { font-weight: 700; }
  .hint { color: var(--soft); font-size: 15px; margin: 0 0 18px; max-width: 40em; }

  /* The shelf */
  .shelf { margin-top: 36px; overflow-x: auto; padding: 0 2px 2px; scrollbar-width: thin; }
  .books { display: flex; align-items: flex-end; gap: 6px; min-height: 250px; padding: 0 8px; width: max-content; }
  .spine { position: relative; display: flex; align-items: flex-start; justify-content: center; text-decoration: none;
           width: var(--w); height: var(--h); background: var(--c); color: #1c1638; border-radius: 6px 6px 2px 2px;
           padding: 14px 0 10px; box-shadow: inset -5px 0 0 rgba(0,0,0,.13), inset 3px 0 0 rgba(255,255,255,.28);
           transform-origin: bottom; transition: transform .15s; }
  .spine:hover, .spine:focus-visible { transform: translateY(-8px); }
  .spine span { writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 700; font-size: 14px; line-height: 1;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: calc(var(--h) - 40px);
                font-variation-settings: "wdth" 80; }
  .spine.dark span { color: #fff; }
  .spine .star { position: absolute; bottom: 8px; left: 50%; translate: -50% 0; font-size: 13px; }
  .plank { height: 14px; background: var(--plank); border-radius: 3px; margin-top: 0; width: max(100%, var(--shelf-w)); }
  @media (prefers-reduced-motion: no-preference) {
    .spine { animation: rise .55s cubic-bezier(.2,.9,.3,1.2) backwards; animation-delay: calc(var(--i) * 45ms); }
    @keyframes rise { from { transform: translateY(40px) scaleY(.6); opacity: 0; } }
  }

  /* Year grid */
  .year { overflow-x: auto; }
  .year svg { display: block; }
  .key { display: flex; gap: 5px; align-items: center; color: var(--soft); font-size: 13px; margin-top: 10px; }
  .key i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  /* Habits */
  .habits { display: grid; grid-template-columns: 1.3fr 1fr; gap: 40px; align-items: start; }
  @media (max-width: 700px) { .habits { grid-template-columns: 1fr; gap: 8px; } }
  .week { display: flex; gap: 8px; align-items: flex-end; height: 170px; }
  .week div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
  .week b { width: 100%; border-radius: 10px 10px 4px 4px; min-height: 4px; }
  .week small, .times small { color: var(--soft); font-size: 13px; }
  .times { display: grid; gap: 10px; }
  .times div { display: grid; grid-template-columns: 90px 1fr auto; gap: 12px; align-items: center; }
  .times .t { height: 18px; background: var(--track); border-radius: 99px; overflow: hidden; }
  .times .t i { display: block; height: 100%; border-radius: 99px; }

  /* Book page */
  .back { display: inline-block; font-weight: 700; text-decoration: none; margin-bottom: 22px; }
  .back:hover { text-decoration: underline; }
  .cover { background: var(--c); color: #1c1638; border-radius: 28px 28px 28px 6px; padding: 34px 30px 30px; }
  .cover.dark { color: #fff; }
  .cover h1 { font-size: clamp(38px, 7vw, 72px); }
  .cover p { margin: 10px 0 0; font-size: 19px; }
  .done { display: inline-block; margin-top: 16px; background: var(--ink); color: var(--page); font-weight: 700;
          border-radius: 99px; padding: 4px 14px; font-size: 15px; }
  .facts { font-size: 21px; line-height: 1.5; max-width: 32em; margin: 28px 0 0; }
  .facts b { font-weight: 800; }
  .chart svg { width: 100%; height: auto; display: block; }
  .tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--page); font-size: 14px; font-weight: 600;
         padding: 5px 10px; border-radius: 8px; opacity: 0; white-space: nowrap; z-index: 2; }
  footer { color: var(--soft); font-size: 14px; margin-top: 64px; }

  /* Spines / Covers switch */
  .views { display: inline-flex; gap: 4px; margin-top: 30px; padding: 4px; background: var(--track); border-radius: 99px; }
  .views button { font: 700 15px "Bricolage Grotesque", system-ui, sans-serif; color: var(--ink); background: none; border: 0;
                  padding: 7px 18px; border-radius: 99px; cursor: pointer; }
  .views button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
  .views button:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  /* Covers */
  .covers { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 26px 20px; margin-top: 28px; }
  @media (max-width: 480px) { .covers { grid-template-columns: repeat(3, 1fr); gap: 20px 12px; } }
  .cv { text-decoration: none; display: block; }
  .art { position: relative; aspect-ratio: 2 / 3; border-radius: 4px 10px 10px 4px; overflow: hidden; background: var(--c);
         color: #1c1638; box-shadow: 6px 6px 0 var(--c2); transition: transform .15s; }
  .cv:hover .art, .cv:focus-visible .art { transform: rotate(-2deg) translateY(-4px); }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .art .plain { padding: 12px 10px; font-weight: 800; font-size: 16px; line-height: 1.05; font-variation-settings: "wdth" 80; }
  .art .plain small { display: block; font-weight: 500; font-size: 12px; margin-top: 6px; }
  .art.dark .plain { color: #fff; }
  .art .star { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; background: var(--sun);
               color: #1c1638; display: grid; place-items: center; font-size: 14px; box-shadow: 0 0 0 2px var(--page); }
  .cv .when { display: block; margin-top: 12px; font-size: 14px; font-weight: 700; }
  .cv .when small { display: block; font-weight: 400; color: var(--soft); }
  .cover.with-art { display: flex; gap: 24px; align-items: flex-end; justify-content: space-between; }
  .cover.with-art img { width: clamp(84px, 18vw, 140px); aspect-ratio: 2 / 3; object-fit: cover; border-radius: 4px 10px 10px 4px;
                        box-shadow: 6px 6px 0 rgba(28,22,56,.25); flex: none; }
</style>
</head>
<body>
<main id="app"><p class="hint">Getting your shelf…</p></main>
<div class="tip" id="tip" aria-hidden="true"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const hm = (sec) => { const m = Math.round(sec / 60); return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`; };
const words = (sec) => { const m = Math.round(sec / 60); if (m < 60) return `${m} minute${m === 1 ? "" : "s"}`;
  const h = Math.round(sec / 360) / 10; return `${h % 1 ? h : Math.round(h)} hour${h === 1 ? "" : "s"}`; };
const fmt = (iso, opt = { month: "short", day: "numeric" }) => new Date(iso + "T12:00").toLocaleDateString(undefined, opt);
const addDays = (iso, n) => { const d = new Date(iso + "T12:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const between = (a, b) => Math.round((new Date(b + "T12:00") - new Date(a + "T12:00")) / 864e5);
const WEEK = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], TIMES = ["Morning", "Afternoon", "Evening", "Night"];
const COLORS = ["tomato", "sun", "grass", "sky", "gum", "grape", "tang", "teal"];
const DARK = new Set(["sky", "grape", "teal"]);  // white titles read better on these
const hashColor = (key) => [...key].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % COLORS.length;
let PICKED = {};
// Each book keeps a hashed color, nudged along the palette so no two shelf neighbours match.
function pickColors(books) {
  PICKED = {}; let prev = -1, prev2 = -1;
  for (const b of books) { let c = hashColor(b.key); while (c === prev || c === prev2) c = (c + 1) % COLORS.length; PICKED[b.key] = COLORS[c]; prev2 = prev; prev = c; }
}
const colorOf = (key) => PICKED[key] || COLORS[hashColor(key)];

function tips(root) {
  const tip = $("#tip");
  root.addEventListener("pointermove", (e) => {
    const t = e.target.closest("[data-tip]")?.dataset.tip;
    if (!t) return (tip.style.opacity = 0);
    tip.textContent = t; tip.style.opacity = 1;
    tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = e.clientY + 16 + "px";
  });
  root.addEventListener("pointerleave", () => (tip.style.opacity = 0));
}

function streakNow(days, today) {
  let n = 0, d = days[today] ? today : addDays(today, -1);
  while (days[d]) { n++; d = addDays(d, -1); }
  return n;
}

const coverUrl = (id) => `https://covers.openlibrary.org/b/id/${id}-M.jpg?default=false`;
let VIEW = "spines";
try { VIEW = localStorage.getItem("view") === "covers" ? "covers" : "spines"; } catch {}

function coverGrid(books) {
  return `<div class="covers">${books.map((b) => {
    const c = colorOf(b.key), next = COLORS[(COLORS.indexOf(c) + 3) % COLORS.length];
    // The plain cover sits underneath; a missing image removes itself and leaves it showing.
    return `<a class="cv" href="#/${encodeURIComponent(b.key)}" aria-label="${esc(b.title)}, ${words(b.seconds)}${b.finished ? ", finished" : ""}">
      <div class="art${DARK.has(c) ? " dark" : ""}" style="--c:var(--${c});--c2:var(--${next})">
        <div class="plain" aria-hidden="true">${esc(b.title)}${b.author ? `<small>${esc(b.author)}</small>` : ""}</div>
        ${b.cover ? `<img src="${coverUrl(b.cover)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
        ${b.finished ? '<span class="star" aria-hidden="true">★</span>' : ""}
      </div>
      <span class="when">${hm(b.seconds)}<small>${b.finished ? "finished" : "reading"}</small></span></a>`;
  }).join("")}</div>`;
}

function shelf(books) {
  const max = Math.max(...books.map((b) => b.seconds));
  const spines = books.map((b, i) => {
    const c = colorOf(b.key), h = Math.round(110 + 140 * Math.sqrt(b.seconds / max)), w = 34 + (i * 7) % 12;
    return `<a class="spine${DARK.has(c) ? " dark" : ""}" href="#/${encodeURIComponent(b.key)}" style="--c:var(--${c});--h:${h}px;--w:${w}px;--i:${i}"
      data-tip="${esc(b.title)} · ${hm(b.seconds)}" aria-label="${esc(b.title)}, ${words(b.seconds)}${b.finished ? ", finished" : ""}">
      <span>${esc(b.title)}</span>${b.finished ? '<i class="star" aria-hidden="true">★</i>' : ""}</a>`;
  }).join("");
  return `<div class="shelf"><div class="books">${spines}</div><div class="plank"></div></div>`;
}

function year(days, today) {
  const cell = 13, gap = 3, weeks = 53, end = new Date(today + "T12:00"), start = new Date(end);
  start.setDate(end.getDate() - 7 * (weeks - 1) - (end.getDay() + 6) % 7);  // Monday-first columns, today in the last one
  const vals = Object.values(days).filter(Boolean).sort((a, b) => a - b);
  const q = (p) => vals.length ? vals[Math.floor(p * (vals.length - 1))] : 1;
  const lv = (s) => !s ? 0 : s <= q(.25) ? 1 : s <= q(.5) ? 2 : s <= q(.8) ? 3 : 4;
  let cells = "", months = "", last = -1;
  for (let w = 0; w < weeks; w++) for (let r = 0; r < 7; r++) {
    const d = new Date(start); d.setDate(start.getDate() + w * 7 + r);
    if (d > end) continue;
    const iso = d.toISOString().slice(0, 10), s = days[iso] || 0, x = w * (cell + gap) + 30, y = r * (cell + gap) + 20;
    cells += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="4" fill="${s ? `var(--heat${lv(s)})` : "var(--track)"}" data-tip="${fmt(iso)} · ${s ? hm(s) : "no reading"}"/>`;
    if (r === 0 && d.getMonth() !== last && (w > 2 || d.getDate() <= 7)) {
      last = d.getMonth(); months += `<text x="${x}" y="12" font-size="12" fill="var(--soft)">${fmt(iso, { month: "short" })}</text>`;
    }
  }
  const rows = ["Mon", "", "Wed", "", "Fri", "", ""].map((t, r) => t && `<text x="0" y="${r * (cell + gap) + 31}" font-size="11" fill="var(--soft)">${t}</text>`).join("");
  return `<svg width="${weeks * (cell + gap) + 30}" height="${7 * (cell + gap) + 20}" role="img" aria-label="Reading by day over the past year">${months}${rows}${cells}</svg>`;
}

function weekBars(byDay) {
  const max = Math.max(1, ...WEEK.map((d) => byDay[d] || 0));
  return `<div class="week">${WEEK.map((d, i) => `<div data-tip="${d} · ${hm(byDay[d] || 0)}">
    <b style="height:${((byDay[d] || 0) / max) * 100}%;background:var(--${COLORS[i]})"></b><small>${d}</small></div>`).join("")}</div>`;
}

function timeBars(byTime) {
  const max = Math.max(1, ...TIMES.map((t) => byTime[t] || 0)), c = ["sun", "tang", "gum", "grape"];
  return `<div class="times">${TIMES.map((t, i) => `<div><small>${t}</small>
    <span class="t"><i style="width:${((byTime[t] || 0) / max) * 100}%;background:var(--${c[i]})"></i></span><small>${hm(byTime[t] || 0)}</small></div>`).join("")}</div>`;
}

function topOf(obj, names) { return names.reduce((a, b) => ((obj[b] || 0) > (obj[a] || 0) ? b : a)); }

function home(data) {
  const g = data.global_stats, today = data.taken_at.slice(0, 10), days = data.days;
  const readDays = Object.keys(days).filter((d) => days[d]).sort();
  const lastRead = readDays[readDays.length - 1];
  const week = [...Array(7)].reduce((s, _, i) => s + (days[addDays(today, -i)] || 0), 0);
  const streak = streakNow(days, today), night = topOf(g.time_of_day, TIMES), fav = topOf(g.weekday, WEEK);
  const favNames = { Mon: "Mondays", Tue: "Tuesdays", Wed: "Wednesdays", Thu: "Thursdays", Fri: "Fridays", Sat: "Saturdays", Sun: "Sundays" };
  return `
    <h1>Syna's<br>shelf</h1>
    <p class="lede"><b>${words(g.seconds)}</b> of reading across <b>${data.books.length} books</b>, ${g.finished} of them finished.
      ${streak ? `You're on a <b>${streak}-day streak</b>.` : lastRead ? `Last read on ${fmt(lastRead)}.` : ""}
      ${week ? `This week so far: <b>${hm(week)}</b>.` : ""} Your longest streak is ${g.longest_streak} days.</p>
    <div class="views" role="group" aria-label="Shelf view">
      <button type="button" data-view="spines" aria-pressed="${VIEW === "spines"}">Spines</button>
      <button type="button" data-view="covers" aria-pressed="${VIEW === "covers"}">Covers</button>
    </div>
    ${VIEW === "covers" ? coverGrid(data.books)
      : `${shelf(data.books)}<p class="hint" style="margin-top:12px">Taller spines got more of your time. Stars are finished books. Tap one to open it.</p>`}

    <h2>Your reading year</h2>
    <p class="hint">${readDays.length} days with reading so far.</p>
    <div class="year">${year(days, today)}</div>
    <div class="key">less ${["track", "heat1", "heat2", "heat3", "heat4"].map((c) => `<i style="background:var(--${c})"></i>`).join("")} more</div>

    <h2>When you read</h2>
    <p class="hint">Mostly on ${favNames[fav]}, and mostly in the ${night.toLowerCase()}.</p>
    <div class="habits">${weekBars(g.weekday)}<div>${timeBars(g.time_of_day)}
      <p class="hint" style="margin-top:12px">Time of day only counts reading since CrossInk.</p></div></div>
    <footer>Updated ${new Date(data.taken_at).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })}</footer>`;
}

function chart(history, color) {
  const ds = Object.keys(history).sort();
  if (!ds.length) return `<p class="hint">No day-by-day reading recorded for this book yet. Sync after you read and it'll fill in here.</p>`;
  const lastDay = ds[ds.length - 1], first = between(ds[0], lastDay) < 13 ? addDays(lastDay, -13) : ds[0];  // at least two weeks wide
  const n = between(first, lastDay) + 1, small = innerWidth < 640;
  const W = small ? 360 : 760, H = small ? 150 : 200, slot = W / n, bw = Math.max(3, slot - (n > 40 ? 1 : 4));
  const max = Math.max(...Object.values(history));
  let bars = "";
  for (let i = 0; i < n; i++) {
    const d = addDays(first, i), s = history[d] || 0, h = s ? Math.max(4, (s / max) * (H - 34)) : 0;
    bars += `<rect x="${i * slot}" y="${H - 20 - h}" width="${bw}" height="${h}" rx="${Math.min(6, bw / 2)}" fill="var(--${color})" data-tip="${fmt(d)} · ${s ? hm(s) : "—"}"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutes read per day">
    <line x1="0" x2="${W}" y1="${H - 19}" y2="${H - 19}" stroke="var(--track)" stroke-width="2"/>${bars}
    <text x="0" y="${H - 2}" font-size="13" fill="var(--soft)">${fmt(first)}</text>
    <text x="${W}" y="${H - 2}" font-size="13" fill="var(--soft)" text-anchor="end">${fmt(lastDay)}</text></svg>`;
}

function bookPage(data, b) {
  const c = colorOf(b.key), tracked = Object.values(b.history).reduce((a, v) => a + v, 0);
  const sittings = b.sessions ? `in <b>${b.sessions} sitting${b.sessions === 1 ? "" : "s"}</b>, about ${hm(b.seconds / b.sessions)} each` : "";
  const span = b.started && b.finished_on ? between(b.started, b.finished_on) + 1 : null;
  const lines = [
    `You've spent <b>${words(b.seconds)}</b> with this one${sittings ? ", " + sittings : ""}.`,
    b.started ? (span ? `You started on ${fmt(b.started)} and finished ${span === 1 ? "the same day" : `${span} days later, on ${fmt(b.finished_on)}`}.`
                      : `You started on ${fmt(b.started, { month: "long", day: "numeric", year: "numeric" })}.`) : "",
    !b.finished && b.seconds_left ? `The reader thinks you have about <b>${hm(b.seconds_left)}</b> left.` : "",
    b.pages >= 20 ? `That's ${b.pages} page turns, roughly ${Math.round(b.pages / (b.seconds / 3600))} an hour.` : "",
  ].filter(Boolean).join(" ");
  const enough = (o) => Object.values(o).reduce((a, v) => a + v, 0) >= b.seconds * 0.5;
  return `
    <a class="back" href="#/">← Back to the shelf</a>
    <section class="cover${DARK.has(c) ? " dark" : ""}${b.cover ? " with-art" : ""}" style="--c:var(--${c})">
      <div><h1>${esc(b.title)}</h1>${b.author ? `<p>${esc(b.author)}</p>` : ""}${b.finished ? '<span class="done">★ Finished</span>' : ""}</div>
      ${b.cover ? `<img src="${coverUrl(b.cover)}" alt="Cover of ${esc(b.title)}" onerror="this.remove()">` : ""}
    </section>
    <p class="facts">${lines}</p>
    <h2>Day by day</h2>
    ${tracked && tracked < b.seconds * 0.95 ? `<p class="hint">Showing ${hm(tracked)} of ${hm(b.seconds)}. Older reading on this book was saved without dates.</p>` : ""}
    <div class="chart">${chart(b.history, c)}</div>
    ${enough(b.weekday) || enough(b.time_of_day) ? `<h2>When you read it</h2><div class="habits">
      ${enough(b.weekday) ? weekBars(b.weekday) : "<div></div>"}${enough(b.time_of_day) ? `<div>${timeBars(b.time_of_day)}</div>` : ""}</div>` : ""}
    <footer>Updated ${new Date(data.taken_at).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })}</footer>`;
}

fetch("data.json", { cache: "no-store" }).then((r) => r.json()).then((data) => {
  pickColors(data.books);
  const render = (keepScroll) => {
    const k = decodeURIComponent(location.hash.replace(/^#\/?/, "")), b = data.books.find((x) => x.key === k);
    document.title = b ? `${b.title} · Syna's Shelf` : "Syna's Shelf";
    $("#app").innerHTML = b ? bookPage(data, b) : home(data);
    const y = $(".year"); if (y) y.scrollLeft = y.scrollWidth;  // open the year grid on recent months
    if (!keepScroll) scrollTo(0, 0);
  };
  $("#app").addEventListener("click", (e) => {
    const v = e.target.closest("[data-view]")?.dataset.view;
    if (!v || v === VIEW) return;
    VIEW = v; try { localStorage.setItem("view", v); } catch {}
    render(true); $(`[data-view="${v}"]`).focus();
  });
  tips($("#app"));
  addEventListener("hashchange", () => render()); render();
}).catch(() => ($("#app").innerHTML = `<h1>Syna's<br>shelf</h1><p class="lede">No stats yet. Open File Transfer on the reader and run Sync Reader.</p>`));
</script>
</body>
</html>
